name: Zap Stanzas

on:
  workflow_dispatch:
  push:
    paths:
      - "Casks/**/*.rb"
    branches-ignore:
      - zap-updates

jobs:
  check:
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rosetta
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            echo "⚙️ Installing Rosetta..."
            sudo softwareupdate --install-rosetta --agree-to-license
          else
            echo "ℹ️ Rosetta not required"
          fi

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Tap repos
        run: |
          brew tap ${{ github.repository_owner }}/$(basename $GITHUB_REPOSITORY)
          brew tap nrlquaker/createzap

      - name: Check casks and add zap
        run: |
          for cask in Casks/*.rb; do
            cask_name=$(basename "$cask" .rb)

            if grep -q "zap" "$cask"; then
              echo "✅ $cask_name already has a zap stanza"
              continue
            fi

            brew install --cask "$cask_name"

            echo "⚠️ $cask_name missing zap stanza, generating..."
            raw_output=$(brew createzap "$cask_name" 2>/dev/null || echo "")

            if echo "$raw_output" | grep -q "No .* settings found"; then
              awk '
              /^end$/ && !done {
                print ""
                print "  # No zap stanza required"
                print $0
                done=1
                next
              }
              { print }
              ' "$cask" > "$cask.tmp" && mv "$cask.tmp" "$cask"
            elif [ -n "$raw_output" ]; then
              zap_content=$(echo "$raw_output" | grep -E "^  (zap|uninstall)" | head -20)
              if [ -n "$zap_content" ]; then
                echo "$zap_content" > /tmp/zap_block.tmp
                awk '
                /^end$/ && !done {
                  print ""
                  while ((getline line < "/tmp/zap_block.tmp") > 0) {
                    print line
                  }
                  close("/tmp/zap_block.tmp")
                  print $0
                  done=1
                  next
                }
                { print }
                ' "$cask" > "$cask.tmp" && mv "$cask.tmp" "$cask"
                rm -f /tmp/zap_block.tmp
              else
                awk '
                /^end$/ && !done {
                  print ""
                  print "  # No zap stanza required"
                  print $0
                  done=1
                  next
                }
                { print }
                ' "$cask" > "$cask.tmp" && mv "$cask.tmp" "$cask"
              fi
            else
              awk '
              /^end$/ && !done {
                print ""
                print "  # No zap stanza required"
                print $0
                done=1
                next
              }
              { print }
              ' "$cask" > "$cask.tmp" && mv "$cask.tmp" "$cask"
            fi
          done
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.TOKEN }}
          branch: zap-updates
          title: "Add zap stanzas"
          body: |
            This PR was automatically generated by GitHub Actions.
            It adds missing `zap` stanzas to casks using [brew-createzap](https://github.com/nrlquaker/homebrew-createzap).
          commit-message: "Add zap stanzas"
          base: main