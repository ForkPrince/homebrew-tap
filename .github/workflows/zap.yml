name: Zap Stanzas

on:
  workflow_dispatch:
  push:
    paths:
      - "Casks/**/*.rb"

jobs:
  check:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Tap repos
        run: |
          brew tap ${{ github.repository_owner }}/$(basename $GITHUB_REPOSITORY)
          brew tap nrlquaker/createzap

      - name: Check casks and add zap
        run: |
          for cask in Casks/*.rb; do
            cask_name=$(basename "$cask" .rb)

            # check if zap is already present
            if grep -q "zap do" "$cask"; then
              echo "✅ $cask_name already has a zap stanza"
              continue
            fi

            brew install --cask "$cask_name"

            echo "⚠️ $cask_name missing zap stanza, generating..."
            zap_block=$(brew createzap "$cask_name" || true)

            if [ -n "$zap_block" ]; then
              echo "" >> "$cask"
              echo "$zap_block" >> "$cask"
              cp "$cask" "zap-fixes/$(basename "$cask")"
            else
              echo "⚠️ Could not generate zap for $cask_name"
            fi
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Add zap stanzas"
            git push --set-upstream origin main
          else
            echo "No changes to commit."
          fi